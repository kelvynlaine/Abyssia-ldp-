name: CI

# Le site est publié par Vercel (projet abyssia-ldp) à chaque push sur main.
# Ce workflow ne publie rien : il vérifie que le site se construit et ne
# s'affiche pas vide, pour repérer une régression avant ou après le déploiement.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # Garde-fou : échoue si le site construit affiche une page vide.
      - name: Smoke test
        run: npm run test:smoke
